apiVersion: apps/v1
kind: Deployment
metadata:
  name: telefon-rehberi-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telefon-rehberi-api
  template:
    metadata:
      labels:
        app: telefon-rehberi-api
    spec:
      containers:
        - name: api
          image: egwyn/telefon-rehberi-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_PORT
              value: "5432"